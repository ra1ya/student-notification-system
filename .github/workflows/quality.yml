name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Dart formatting
        run: dart format lib test

      - name: Commit formatter changes when needed
        shell: bash
        run: |
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "Apply Dart formatting [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

  php:
    name: PHP quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        run: find php_files -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Composer manifest
        run: php -r '$d=json_decode(file_get_contents("php_files/composer.json"), true, 512, JSON_THROW_ON_ERROR); if (!isset($d["require"])) { exit(1); } echo "composer.json is valid\n";'
